[tool.poetry]
name = "consensus-curator"
version = "0.1.0"
description = "Multi-source evidence collection, consensus scoring, and content generation pipeline."
authors = ["you <you@example.com>"]
readme = "README.md"
packages = [{ include = "consensus_curator", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2.60"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
python-dotenv = "^1.0.1"
feedparser = "^6.0.11"
trafilatura = "^1.12.2"
sentence-transformers = "^3.3.1"
scikit-learn = "^1.5.2"
numpy = "^1.26.4"
tenacity = "^9.0.0"
rich = "^13.9.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
ruff = "^0.8.1"
mypy = "^1.13.0"

[tool.poetry.scripts]
run-pipeline = "scripts.run_pipeline:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
