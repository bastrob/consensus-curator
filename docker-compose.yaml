services:
  postgres:
    image: postgres:16-alpine
    container_name: consensus_curator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: consensus_curator
      POSTGRES_PASSWORD: consensus_curator
      POSTGRES_DB: consensus_curator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U consensus_curator" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
